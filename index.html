<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Travel manager</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232b6cb0'/%3E%3Cpath d='M7 21l18-9-4 13-5-5-3 3-1-6z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#edf0f3; --surface:#fff; --wk:#f5f7f9; --ink:#15212b; --muted:#5a6773; --line:#d3dae1; --hover:#e8edf1;
  --danger:#b3261e; --ok:#2e7d4f; --warn:#b26a00;
  --c-stay:#8a5a2b; --c-food:#c0562a; --c-act:#8e44ad; --c-trans:#2b6cb0; --c-other:#5b7083;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#11161b; --surface:#1a2129; --wk:#171d24; --ink:#e7ecf0; --muted:#94a1ad; --line:#2d3740; --hover:#242e37;
    --danger:#ff8a80; --ok:#7ad39c; --warn:#f0b85a;
    --c-stay:#d9a56b; --c-food:#f09a70; --c-act:#cf9de6; --c-trans:#7db4ff; --c-other:#a9b8c6;}
}
.k-stay{--k:var(--c-stay)} .k-food{--k:var(--c-food)} .k-activity{--k:var(--c-act)} .k-transport{--k:var(--c-trans)} .k-other{--k:var(--c-other)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 40px}

.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:12px}
.bar h1{font-size:20px;margin:0 6px 0 0;font-weight:650;letter-spacing:-.01em}
.bar select{font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:240px}
.sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13.5px}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:3px 8px;font-size:12.5px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-size:13.5px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.pill .sd{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.ok .sd{background:var(--ok)} .pill.bad .sd{background:var(--danger)} .pill.warn .sd{background:var(--warn)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:5px;z-index:20;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--k,var(--ink))}
.menu button:hover{background:var(--hover)}

.layout{display:grid;grid-template-columns:230px 1fr;gap:14px;align-items:start}
.rail{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px;position:sticky;top:8px;max-height:calc(100vh - 24px);overflow:auto}
.rd{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:8px;padding:6px 8px;cursor:pointer}
.rd:hover{background:var(--hover)}
.rd.sel{background:var(--hover);border-color:var(--ink)}
.rd .n{font-size:11.5px;color:var(--muted)}
.rd .d{font-weight:600}
.rd .tt{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd .ic{display:flex;gap:5px;margin-top:2px}
.rd .ic span{display:inline-flex;align-items:center;gap:2px;font-size:11px;color:var(--k)}
.rd.empty .d{color:var(--muted);font-weight:500}
.main{min-width:0}

.dayhead{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.dayhead .row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dayhead h2{margin:0;font-size:20px;font-weight:650}
.dayhead .sub{color:var(--muted);font-size:13px}
.dtitle{font:inherit;font-size:15px;font-weight:600;width:100%;margin-top:8px;border:1px solid transparent;border-radius:7px;padding:4px 6px;background:transparent;color:var(--ink)}
.dtitle:hover,.dtitle:focus{border-color:var(--line);background:var(--bg)}
.daynotes{width:100%;margin-top:6px;font:inherit;font-size:13px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-height:38px;resize:vertical}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;border-left:4px solid var(--k)}
.sec>header{display:flex;align-items:center;gap:8px;padding:9px 12px;color:var(--k);font-weight:650}
.sec>header .cnt{font-weight:500;color:var(--muted);font-size:12.5px}
.sec .list{padding:0 10px 10px;display:grid;gap:8px}
.sec .none{padding:0 14px 12px;color:var(--muted);font-size:13px}
.card{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--wk);border-radius:9px;padding:9px 11px;cursor:pointer}
.card:hover{background:var(--hover)}
.card .ico{color:var(--k);padding-top:1px}
.card .cb{flex:1;min-width:0}
.card .t1{font-weight:600}
.card .tm{font-variant-numeric:tabular-nums;color:var(--k);margin-right:6px;font-weight:650}
.card .t2{color:var(--muted);font-size:12.5px;margin-top:1px;overflow-wrap:anywhere}
.card .nt{font-size:12.5px;margin-top:4px;color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere;max-height:3.9em;overflow:hidden}
.badges{display:flex;gap:7px;color:var(--muted);font-size:12px;align-items:center;flex:none}
.badges span{display:inline-flex;align-items:center;gap:2px}
.tag{display:inline-block;font-size:11px;font-weight:650;padding:0 7px;border-radius:999px;background:var(--k);color:var(--surface);margin-left:6px;vertical-align:1px}
.mini{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--muted);margin-left:5px}

.cal{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cal .hd,.cal .wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .hd div{padding:6px 8px;font-size:12px;color:var(--muted);background:var(--wk);border-bottom:1px solid var(--line)}
.cd{min-height:118px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 5px;cursor:pointer;min-width:0}
.cd:nth-child(7n){border-right:0}
.cd.out{background:var(--wk);opacity:.55;cursor:default}
.cd:not(.out):hover{background:var(--hover)}
.cd .dn{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.cd .dn b{color:var(--ink)}
.chip{display:flex;gap:3px;align-items:center;font-size:11.5px;margin-top:2px;padding:1px 4px;border-radius:5px;background:color-mix(in srgb,var(--k) 16%,transparent);color:var(--ink);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.chip svg{color:var(--k);width:12px;height:12px}
.chip span{overflow:hidden;text-overflow:ellipsis}
.more{font-size:11px;color:var(--muted);margin-top:2px}

.agday{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:10px 14px}
.agday h3{margin:0 0 6px;font-size:15px}
.agi{display:flex;gap:8px;align-items:baseline;padding:3px 0;cursor:pointer}
.agi:hover{background:var(--hover)}
.agi .ico{color:var(--k)}
.agi .tm{width:48px;font-variant-numeric:tabular-nums;color:var(--muted);flex:none}

#bigmap,.mapbox{height:520px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--wk)}
.mapbox.sm{height:260px;border-radius:9px}
.mapnote{font-size:12px;color:var(--muted);margin-top:4px}
.leaflet-container{font:inherit}
.pin{width:22px;height:22px;border-radius:50%;background:var(--k,#2b6cb0);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}

dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:0;width:min(760px,95vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,.dbody{display:flex;flex-direction:column;max-height:92vh}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--k,var(--ink));font-weight:650;font-size:16px}
.dh .x{margin-left:auto;border:0;background:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted)}
.db{padding:14px 16px;overflow:auto;display:grid;gap:12px}
.df{display:flex;gap:8px;justify-content:flex-end;padding:11px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.df .l{margin-right:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.f input,.f select,.f textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
.f textarea{min-height:90px;resize:vertical}
.blk{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.blk h4{margin:0;font-size:13px;display:flex;align-items:center;gap:6px}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;font-size:13px;color:var(--muted);background:var(--bg);cursor:text;outline-offset:2px}
.drop:focus,.drop.over{border-color:var(--ink);color:var(--ink)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--wk);overflow:hidden;max-width:170px}
.att img{display:block;max-width:170px;max-height:120px;cursor:zoom-in;object-fit:cover}
.att .fn{padding:6px 8px;font-size:12px;overflow-wrap:anywhere;cursor:pointer}
.att .fn small{display:block;color:var(--muted)}
.att .rm{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;line-height:1;padding:0;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;cursor:pointer;font-size:12.5px}
.sum{display:flex;flex-wrap:wrap;gap:6px}
.sum span{border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12.5px}
.sum .n{background:#2e7d4f22}.sum .u{background:#b26a0022}.sum .m{background:#2b6cb022}.sum .x{background:#b3261e22}
.pv{max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.pv h5{margin:8px 0 2px;font-size:13px}
.pv .r{display:flex;gap:6px;align-items:baseline;padding:1px 0}
.pv .st{font-size:11px;font-weight:650;width:56px;flex:none}
.st.new{color:var(--ok)}.st.upd{color:var(--warn)}.st.mv{color:var(--c-trans)}.st.same{color:var(--muted)}
pre.fmt{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;white-space:pre-wrap;margin:0}
#lb{width:min(96vw,1100px);background:#000;border:0}
#lb img{max-width:100%;max-height:88vh;display:block;margin:0 auto}
#lb .lbx{position:absolute;top:6px;right:10px;color:#fff;background:none;border:0;font-size:28px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 14px;border-radius:9px;font-size:13.5px;z-index:99;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.foot{margin-top:18px;font-size:11.5px;color:var(--muted);text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .rail{position:static;max-height:none;display:flex;gap:6px;overflow-x:auto;padding:6px}
  .rd{min-width:132px}
  .grid2,.grid3{grid-template-columns:1fr}
  .cd{min-height:84px}.chip span{display:none}
}
@media print{
  body{background:#fff}
  .bar,.rail,.df,.foot,.toast,.dayhead textarea,.sec header button,.nop{display:none!important}
  .layout{display:block}
  .sec,.agday,.dayhead{break-inside:avoid;border-color:#bbb}
}

.bk{display:inline-block;font-size:11px;font-weight:650;padding:0 8px;border-radius:999px;border:1px solid var(--line);margin-left:6px;color:var(--ink);white-space:nowrap}
.rep-head .bk,.rep-bar .bk{margin-left:0;margin-right:6px}
.bk-confirmed{background:#2e7d4f33;border-color:#2e7d4f88}.bk-tobook{background:#b3261e2e;border-color:#b3261e88}.bk-optional{background:#b26a0030;border-color:#b26a0088}.bk-included{background:#2b6cb030;border-color:#2b6cb088}
.layout.rep{grid-template-columns:1fr}.layout.rep .rail{display:none}
.rep-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.rep-bar .sp{flex:1}.chk{font-size:13px;display:flex;gap:5px;align-items:center}
.rep-bar .seg button .n{font-size:11px;opacity:.7;margin-left:3px}
.rep-head h2{margin:0 0 6px;font-size:19px}.rep-chips{margin:4px 0 6px}
.rep-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);margin-top:8px}
.rep-t{border-collapse:collapse;width:100%;font-size:13px}
.rep-t th{position:sticky;top:0;background:var(--surface);text-align:left;font-size:12px;color:var(--muted);padding:7px 9px;border-bottom:2px solid var(--line);white-space:nowrap}
.rep-t td{padding:6px 9px;border-bottom:1px solid var(--line);vertical-align:top;min-width:56px}
.rep-t td.strong{font-weight:650;min-width:150px}
.rep-t tbody tr{cursor:pointer}.rep-t tbody tr:hover{background:#8881}
.rep-un{margin-top:14px;font-size:13px}.rep-un h4{margin:0 0 4px}.rep-un li{margin:2px 0}
@media print{.rep-wrap{overflow:visible;border:0}.rep-t{font-size:10px}.rep-t td,.rep-t th{padding:3px 5px}.rep-t tr{break-inside:avoid}.layout.rep{display:block}}
.srcrow{display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line)}.srcrow:first-of-type{border-top:0}.srcbtn{display:flex;gap:5px;flex-wrap:wrap}
.calfilt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:8px}.fchip{display:inline-flex;gap:5px;align-items:center;font:inherit;font-size:13px;font-weight:600;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer;opacity:.7}.fchip.on{background:var(--k);color:var(--surface);border-color:var(--k);opacity:1}.fchip svg{width:14px;height:14px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>Travel manager</h1>
    <select id="tripSel" aria-label="Trip"></select>
    <div class="seg" id="viewSeg">
      <button data-view="day">Day</button><button data-view="cal">Calendar</button><button data-view="agenda">Agenda</button><button data-view="map">Map</button><button data-view="reports">Reports</button>
    </div>
    <span class="sp"></span>
    <button class="btn" data-act="import"><svg class="i" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>Import itinerary</button>
    <div class="menuwrap"><button class="btn primary" data-act="addmenu">+ Add</button><div class="menu" id="addMenu" hidden></div></div>
    <button class="btn" data-act="print" title="Print or save as PDF">Print</button>
    <button class="btn" data-act="trip">Trip</button>
    <button class="pill" id="pill" data-act="data" title="Data &amp; sync"><i class="sd"></i><span class="tx">Local only</span></button>
  </div>
  <div class="layout">
    <nav class="rail" id="rail" aria-label="Days"></nav>
    <main class="main" id="main"></main>
  </div>
  <div class="foot" id="foot"></div>
</div>
<dialog id="dlg"></dialog>
<dialog id="dlg2"></dialog>
<dialog id="lb"><button class="lbx" id="lbx" aria-label="Close">&times;</button><img id="lbimg" alt=""></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* order within a day: by start time (00:00–03:59 counts as after midnight); untimed items follow the item before them in the itinerary */
function minOf(t){const m=/^(\d{1,2}):(\d{2})/.exec(t||'');if(!m)return null;let v=+m[1]*60+ +m[2];if(v<240)v+=1440;return v;}

  const its=tripItems().filter(i=>i.type!=='stay'&&i.date===date);
  const eff=[];let last=null;
  its.forEach((i,k)=>{let v=minOf(i.time);if(v==null&&i.slot&&SLOT_TIME[i.slot])v=minOf(SLOT_TIME[i.slot]);
    if(v!=null){last=v;eff[k]=v;}else eff[k]=last==null?null:last+0.001*(k+1);});
  let next=null;for(let k=its.length-1;k>=0;k--){if(eff[k]!=null)next=eff[k];else eff[k]=next==null?99999:next-0.5+0.0001*k;}
  const m=new Map();its.forEach((i,k)=>m.set(i.id,eff[k]+k/100000));return m;
}
function itemsOnDay(date,type){
  const arr=tripItems().filter(i=>i.type===type&&(i.type==='stay'?(i.date&&i.date<=date&&date<=(i.endDate||i.date)):i.date===date));
  if(type==='stay')return arr.sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))||a.title.localeCompare(b.title));
  const m=dayOrder(date);
  return arr.sort((a,b)=>(m.get(a.id)||0)-(m.get(b.id)||0));
}

const graphUrl=(path,suffix)=>'https://graph.microsoft.com/v1.0/me/drive/root:/'+path.split('/').map(encodeURIComponent).join('/')+(suffix==null?':/content':suffix);
async function getToken(interactive){
  if(!msalApp)return null;
  const acct=msalAccount||msalApp.getAllAccounts()[0];if(!acct)return null;
  try{const r=await msalApp.acquireTokenSilent({scopes:GRAPH_SCOPES,account:acct});msalAccount=r.account;return r.accessToken;}
  catch(e){if(!interactive)return null;const r=await msalApp.acquireTokenPopup({scopes:GRAPH_SCOPES});msalAccount=r.account;return r.accessToken;}
}
async function gGetText(path){
  const tk=await getToken(true);if(!tk)throw new Error('Not signed in');
  const r=await fetch(graphUrl(path),{headers:{Authorization:'Bearer '+tk}});
  if(r.status===404)return null;
  if(!r.ok)throw new Error('OneDrive read failed (HTTP '+r.status+')');
  return await r.text();
}
async function gGetBlob(path){
  const tk=await getToken(false);if(!tk)return null;

  if(!r.ok)return null;
  return await r.blob();
}
async function gPut(path,body,ctype){
  const tk=await getToken(true);if(!tk)throw new Error('Not signed in');

    const r=await fetch(graphUrl(path),{method:'PUT',headers:{Authorization:'Bearer '+tk,'Content-Type':ctype||'application/octet-stream'},body});
    if(!r.ok)throw new Error('OneDrive save failed (HTTP '+r.status+')');return;
  }
  const sr=await fetch(graphUrl(path,':/createUploadSession'),{method:'POST',headers:{Authorization:'Bearer '+tk,'Content-Type':'application/json'},body:JSON.stringify({item:{'@microsoft.graph.conflictBehavior':'replace'}})});
  if(!sr.ok)throw new Error('Could not start a large upload (HTTP '+sr.status+')');
  const up=(await sr.json()).uploadUrl,chunk=3276800;
  const buf=body instanceof Blob?new Uint8Array(await body.arrayBuffer()):new TextEncoder().encode(body);
  for(let s=0;s<buf.length;s+=chunk){
    const e=Math.min(s+chunk,buf.length),part=buf.slice(s,e);
    const r=await fetch(up,{method:'PUT',headers:{'Content-Length':String(part.length),'Content-Range':'bytes '+s+'-'+(e-1)+'/'+buf.length},body:part});
    if(!r.ok&&r.status!==202)throw new Error('Upload interrupted (HTTP '+r.status+')');
  }
}

async function saveToOneDrive(force){

    if(!force){
      const cur=await gGetText(DATA_FILE);
      if(cur!==null&&lastText!==null&&cur!==lastText&&cur.trim()){
        const c=await askChoice('The travel file changed elsewhere','Another device changed your travel data since this page last read it. Which version do you want to keep?',['Load the other version','Overwrite it with what is on this page']);
        if(c===0){data=normalise(JSON.parse(cur));lastText=cur;setDirtyFlag(false);cacheLocal();setStatus('saved');ensureSel();renderAll();return;}
      }

      const g=n=>{const i=col(n);return i>=0?(r[i]||'').trim():'';};
      const dt=findDate(g('date'),opts&&opts.start);if(!dt){res.warnings.push('Skipped a row with no valid date.');continue;}
      const it=Object.assign(blankItem(),{date:dt.iso,time:toHHMM(g('time')||g('start')),endTime:toHHMM(g('end')),title:g('title')||g('activity')||g('item'),place:g('place')||g('location'),from:g('from'),to:g('to'),mode:g('mode'),notes:g('notes')});
      const ty=g('type')||g('category');it.type=sectionOf(ty)||(/stay|hotel|accom/i.test(ty)?'stay':/food|meal/i.test(ty)?'food':/transport|travel/i.test(ty)?'transport':/activ/i.test(ty)?'activity':/other|misc/i.test(ty)?'other':classify(it.title));
      if(it.type==='stay')it.endDate=findDate(g('end date')||g('check'),opts&&opts.start)?.iso||addDays(it.date,1);
      if(!it.title)continue;res.items.push(it);
    }

  }

}

/* ============ MERGE ============ */
const keyOf=i=>(i.impType||i.type)+'|'+i.date+'|'+norm(i.title);
function dice(a,b){a=norm(a).replace(/ /g,'');b=norm(b).replace(/ /g,'');if(a.length<2||b.length<2)return 0;const bg=s=>{const m=new Map();for(let i=0;i<s.length-1;i++){const g=s.slice(i,i+2);m.set(g,(m.get(g)||0)+1);}return m;};const A=bg(a),B=bg(b);let n=0;A.forEach((v,k)=>{if(B.has(k))n+=Math.min(v,B.get(k));});return 2*n/(a.length+b.length-2);}
function jac(a,b){const A=new Set(norm(a).split(' ').filter(Boolean)),B=new Set(norm(b).split(' ').filter(Boolean));if(!A.size||!B.size)return 0;let n=0;A.forEach(x=>{if(B.has(x))n++;});return n/(A.size+B.size-n);}
const snap=n=>{const o={};for(const f of IMPORT_FIELDS)o[f]=n[f]||'';return o;};
function hasUserContent(i){const ed=['bk','ref','price','how','svc','bkNote'].some(f=>(i[f]||'')!==((i.imp&&i.imp[f])||''));return !!(i.notes&&i.notes.trim())||(i.atts&&i.atts.length)||i.mapLink||i.coordManual||i.link||ed;}
function planImport(parsed,tripId){
  const existing=data.items.filter(i=>i.trip===tripId);
  const used=new Set(),rows=[];
  const idx=new Map();existing.forEach(i=>{const k=keyOf(i);if(!idx.has(k))idx.set(k,[]);idx.get(k).push(i);});
  let pending=[];
  parsed.items.forEach(n=>{const a=idx.get(keyOf(n));const m=a&&a.find(x=>!used.has(x.id));if(m){used.add(m.id);rows.push({n,m,how:'exact'});}else pending.push(n);});
  const p2=[];
  pending.forEach(n=>{
    const cand=existing.filter(x=>!used.has(x.id)&&(x.impType||x.type)===n.type&&norm(x.title)===norm(n.title));
    const same=pending.filter(q=>q.type===n.type&&norm(q.title)===norm(n.title)).length;
    if(cand.length===1&&same===1){used.add(cand[0].id);rows.push({n,m:cand[0],how:'moved'});}else p2.push(n);
  });
  const p3=[];
  p2.forEach(n=>{
    let best=null,bs=0;existing.forEach(x=>{if(used.has(x.id)||(x.impType||x.type)!==n.type||x.date!==n.date)return;const s=Math.max(jac(n.title,x.title),dice(n.title,x.title)-.2);if(s>bs){bs=s;best=x;}});
    if(best&&bs>=.5){used.add(best.id);rows.push({n,m:best,how:'renamed'});}else p3.push(n);
  });
  p3.forEach(n=>rows.push({n,m:null,how:'new'}));
  rows.forEach(r=>{
    r.changes=[];
    if(!r.m)return;
    const m=r.m;
    for(const f of IMPORT_FIELDS){
      const nv=r.n[f]||'';
      if(m.imp){if(nv!==(m.imp[f]||'')&&nv!==(m[f]||''))r.changes.push(f);}
      else if(!(m[f]||'')&&nv)r.changes.push(f);
    }
    if(!(m.notes||'').trim()&&r.n.notes)r.changes.push('notes');
  });
  const missing=existing.filter(x=>x.src==='import'&&!used.has(x.id));
  const count={new:0,upd:0,same:0,mv:0};
  rows.forEach(r=>{if(!r.m)count.new++;else if(r.how==='moved'||r.how==='renamed')count.mv++;else if(r.changes.length)count.upd++;else count.same++;});
  return {rows,missing,count};
}
function applyImport(plan,parsed,o){
  try{localStorage.setItem(LS_PREV,JSON.stringify(data));}catch(e){}
  let t=data.trips.find(x=>x.id===o.tripId);
  if(!t){t={id:o.tripId||uid(),name:o.name||parsed.name||'New trip',start:'',end:'',region:o.region||'',days:{},created:Date.now()};data.trips.push(t);}
  if(o.region&&!t.region)t.region=o.region;
  for(const r of plan.rows){
    if(!r.m){
      const it=Object.assign({id:uid(),trip:t.id,ref:'',link:'',address:'',mapLink:'',notes:'',atts:[],coord:null,fromCoord:null,toCoord:null,src:'import'},r.n);
      it.imp=snap(r.n);data.items.push(it);continue;
    }
    const m=r.m;
    for(const f of r.changes){
      if(f==='notes'){m.notes=r.n.notes;continue;}
      m[f]=r.n[f]||'';
      if(!m.coordManual){if(f==='place'||f==='title')m.coord=null;if(f==='from')m.fromCoord=null;if(f==='to')m.toCoord=null;}
    }
    if(m.src==='import')m.imp=snap(r.n);
    delete m.gone;
  }
  plan.missing.forEach(m=>{
    if(o.removeMissing&&!hasUserContent(m)){data.items=data.items.filter(x=>x.id!==m.id);}
    else m.gone=true;
  });
  for(const d of parsed.days){
    const cur=t.days[d.date]||(t.days[d.date]={title:'',notes:''});
    if(d.title&&(!cur.title||cur.title===cur.impTitle))cur.title=d.title;
    cur.impTitle=d.title;
    if(d.notes&&(!cur.notes||cur.notes===cur.impNotes))cur.notes=d.notes;
    cur.impNotes=d.notes||'';
  }
  if(parsed.unmatched)t.unmatched=parsed.unmatched;
  const r=tripRange(Object.assign({},t,{start:'',end:''}));
  if(r.start){t.start=r.start;t.end=r.end;}
  return t;
}

/* ============ GEOCODING & MAPS ============ */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const geoQueue=[];let geoBusy=false;
function geocode(q){
  q=String(q||'').trim();if(!q)return Promise.resolve(null);
  const key=norm(q);if(data.geo[key]!==undefined)return Promise.resolve(data.geo[key]);
  return new Promise(res=>{geoQueue.push({q,key,res});pumpGeo();});
}
async function pumpGeo(){
  if(geoBusy)return;geoBusy=true;
  while(geoQueue.length){
    const j=geoQueue.shift();
    if(data.geo[j.key]!==undefined){j.res(data.geo[j.key]);continue;}
    let v,ok=false;
    try{
      const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=en&q='+encodeURIComponent(j.q));
      if(r.ok){const a=await r.json();v=a[0]?{lat:+a[0].lat,lng:+a[0].lon}:null;ok=true;}
    }catch(e){}
    if(!ok){ /* Nominatim refused (e.g. page opened from a file) – try Photon, which has no referrer rule */
      try{
        const r=await fetch('https://photon.komoot.io/api/?limit=1&lang=en&q='+encodeURIComponent(j.q));
        if(r.ok){const a=await r.json(),f=a.features&&a.features[0];v=f?{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}:null;ok=true;}
      }catch(e){}
    }
    if(ok){data.geo[j.key]=v;j.res(v);}else j.res(null);
    await sleep(1100);
  }
  geoBusy=false;
}
function geoQ(it,which){
  const reg=(trip()&&trip().region)||'';
  let base=which==='from'?it.from:which==='to'?it.to:(it.address||it.place||it.title);
  if(which!=='place'&&/^(the )?hotel$/i.test(String(base||'').trim())){const s=itemsOnDay(it.date,'stay')[0];if(s)base=s.address||s.title;}
  return base?[base,reg].filter(Boolean).join(', '):'';
}
const hasL=()=>typeof window.L!=='undefined';
function arcPoints(a,b){
  const mx=(a.lat+b.lat)/2,my=(a.lng+b.lng)/2,dx=b.lng-a.lng,dy=b.lat-a.lat;
  const c={lat:mx+dx*.18,lng:my-dy*.18};const pts=[];
  for(let i=0;i<=40;i++){const t=i/40,u=1-t;pts.push([u*u*a.lat+2*u*t*c.lat+t*t*b.lat,u*u*a.lng+2*u*t*c.lng+t*t*b.lng]);}
  return pts;
}
async function drawRoute(map,a,b,mode,color){
  let note='Straight line between the two places — not the actual track or road.';
  let pts=[[a.lat,a.lng],[b.lat,b.lng]],dash='6 6';
  if(mode==='flight'){pts=arcPoints(a,b);note='Flight path shown as an arc.';}
  else if(mode==='car'||mode==='bus'){
    try{
      const r=await fetch('https://router.project-osrm.org/route/v1/driving/'+a.lng+','+a.lat+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson');
      if(r.ok){const j=await r.json();if(j.routes&&j.routes[0]){pts=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);dash=null;note='Driving route (approximate road line).';}}
    }catch(e){}
  }
  const line=L.polyline(pts,{color:color||'#2b6cb0',weight:4,opacity:.85,dashArray:dash}).addTo(map);
  return {line,note};
}
const TYPE_COLOR={stay:'#8a5a2b',food:'#c0562a',activity:'#8e44ad',transport:'#2b6cb0',other:'#5b7083'};

function newMap(el){
  const m=L.map(el,{scrollWheelZoom:true});
  const esri=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, OpenStreetMap contributors'}).addTo(m);

/* ============ REPORTS: accommodation, meals, transport (with bookings) ============ */
let repTab='stay',repAll=false,repMeal='',repMode='';
const BK_SHORT={confirmed:'Booked',tobook:'To book',optional:'Recommended',included:'Included',none:'No booking'};
const bkTag=it=>(it.bk&&it.bk!=='none')?'<span class="bk bk-'+it.bk+'">'+BK_SHORT[it.bk]+'</span>':'';
const isBookable=i=>['confirmed','tobook','optional','included'].includes(i.bk)||(i.type==='transport'&&i.mode==='flight');
const BK_MEAL=k=>(MEALS.find(m=>m[0]===k)||[])[1]||k;
const modeLabel=m=>(MODES.find(x=>x[0]===m)||[])[1]||'';
const when=(d,t)=>fmtShort(d)+(t?' '+t:'');
const trunc=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1)+'…':s;};
const REP={
  stay:{label:'Accommodation',cols:[
    ['Check-in',i=>when(i.date,i.time)],['Check-out',i=>when(i.endDate,i.endTime)],['Nights',i=>String(Math.max(1,diffDays(i.date,i.endDate||addDays(i.date,1))))],
    ['Accommodation',i=>i.title],['City / address',i=>i.address||i.place],['Status',i=>BK_LABEL[i.bk]||''],['Reference',i=>i.ref],['Price',i=>i.price],['How to book / contact',i=>i.how],['Booking note',i=>i.bkNote],['Notes',i=>trunc(i.notes,160)]]},
  food:{label:'Meals',cols:[
    ['Date',i=>fmtShort(i.date)],['Meal',i=>(MEALS.find(m=>m[0]===i.meal)||[])[1]||''],['Time',i=>i.time+(i.endTime?'–'+i.endTime:'')],['Restaurant / meal',i=>i.title],['Where',i=>i.place],
    ['Status',i=>BK_LABEL[i.bk]||''],['Reference',i=>i.ref],['Price',i=>i.price],['How to book / contact',i=>i.how],['Booking note',i=>i.bkNote],['Notes',i=>trunc(i.notes,160)]]},
  transport:{label:'Transport',cols:[
    ['Date',i=>fmtShort(i.date)],['Depart',i=>i.time],['Arrive',i=>i.endTime],['Journey',i=>(i.from||i.to)?i.from+' → '+i.to:i.title],['Mode',i=>modeLabel(i.mode)],['Service',i=>i.svc],
    ['Status',i=>BK_LABEL[i.bk]||''],['Reference',i=>i.ref],['Price',i=>i.price],['How to book / contact',i=>i.how],['Booking note',i=>i.bkNote]]}
};
function repItems(tab){
  let its=tripItems().filter(i=>i.type===tab);
  if(tab!=='stay'&&!repAll)its=its.filter(isBookable);
  if(tab==='food'&&repMeal)its=its.filter(i=>i.meal===repMeal);
  if(tab==='transport'&&repMode)its=its.filter(i=>(i.mode||'other')===repMode);
  const om={};const ord=i=>{if(tab==='stay')return 0;const m=om[i.date]||(om[i.date]=dayOrder(i.date));return m.get(i.id)||0;};
  return its.sort((a,b)=>a.date.localeCompare(b.date)||ord(a)-ord(b)||(tab==='stay'?(a.time||'').localeCompare(b.time||''):0));
}
function priceTotals(its){
  const tot={};
  its.forEach(i=>{const m=String(i.price||'').match(/(A\$|AU\$|AUD|US\$|\$|¥|JPY|£|€)\s?(\d[\d,]*(?:\.\d+)?)/i);if(!m)return;
    let c=m[1].toUpperCase();c=({'AU$':'A$','AUD':'A$','JPY':'¥'}[c])||c;const v=parseFloat(m[2].replace(/,/g,''));tot[c]=(tot[c]||0)+v;});
  return Object.entries(tot).map(([c,v])=>c+v.toLocaleString(undefined,{maximumFractionDigits:2})).join(' + ');
}
function nightsGap(){
  const t=trip(),r=tripRange(t);if(!r.start)return [];
  const stays=tripItems().filter(i=>i.type==='stay'),out=[];
  for(let d=r.start;d<r.end;d=addDays(d,1)){if(!stays.some(s=>s.date<=d&&d<(s.endDate||addDays(s.date,1))))out.push(d);}
  return out;
}
function repUnmatchedHtml(tab){

    ?'<li><b>'+esc(r.name)+'</b>'+(r.date?' · '+esc(fmtShort(r.date)):'')+' — '+esc(r.win||'')+(r.how?' · '+esc(r.how):'')+'</li>'
    :'<li><b>'+esc(r.leg)+'</b> — '+esc(r.mode||'')+' · '+esc(r.price||'')+' · '+esc(r.rsv||'')+(r.how?' · '+esc(r.how):'')+'</li>').join('')+'</ul></div>';
}

  const tabs=Object.keys(REP).map(k=>'<button data-act="reptab" data-tab="'+k+'" class="'+(k===repTab?'on':'')+'">'+REP[k].label+' <span class="n">'+tripItems().filter(i=>i.type===k&&(k==='stay'||isBookable(i))).length+'</span></button>').join('');

  const chips='<span class="bk bk-confirmed">'+cnt('confirmed')+' booked</span><span class="bk bk-tobook">'+cnt('tobook')+' to book</span><span class="bk bk-optional">'+cnt('optional')+' recommended</span><span class="bk bk-included">'+cnt('included')+' included</span>'+(repTab==='stay'?'<span class="bk">'+nights+' nights</span>':'');
  const pc=priceTotals(its.filter(i=>i.bk==='confirmed')),pa=priceTotals(its);
  let h='<div class="rep"><div class="rep-bar nop"><div class="seg" id="repSeg">'+tabs+'</div><span class="sp"></span>'+
    (repTab==='food'?'<label class="chk">Meal <select id="rep_meal">'+[['','All meals']].concat(MEALS.filter(m=>m[0])).map(m=>'<option value="'+m[0]+'"'+(m[0]===repMeal?' selected':'')+'>'+m[1]+'</option>').join('')+'</select></label>':'')+
    (repTab==='transport'?'<label class="chk">Type <select id="rep_mode">'+[['','All types']].concat(MODES).map(m=>'<option value="'+m[0]+'"'+(m[0]===repMode?' selected':'')+'>'+m[1]+'</option>').join('')+'</select></label>':'')+
    (repTab!=='stay'?'<label class="chk"><input type="checkbox" id="rep_all" '+(repAll?'checked':'')+'> Show everything, not just bookings</label>':'')+

    '<div class="rep-head"><h2>'+esc(t.name)+' — '+R.label+(repTab!=='stay'&&!repAll?' bookings':'')+(repTab==='food'&&repMeal?' — '+esc(BK_MEAL(repMeal)):'')+(repTab==='transport'&&repMode?' — '+esc(modeLabel(repMode)):'')+'</h2><div class="rep-chips">'+chips+'</div>'+
    (pa?'<div class="hint">Listed prices (first figure on each line; “pp” means per person): '+(pc?'<b>booked '+esc(pc)+'</b> · ':'')+'all listed '+esc(pa)+'</div>':'')+
    (gaps.length?'<div class="hint" style="color:var(--warn)">⚠ No accommodation for the night of '+gaps.map(d=>esc(fmtShort(d))).join(', ')+'</div>':'')+'</div>';
  if(!its.length)h+='<div class="empty"><p>Nothing to show here yet.'+(repTab!=='stay'&&!repAll?' Tick “Show everything” or change the filter to list every '+(repTab==='food'?'meal':'journey')+', or open an item and set its booking status.':'')+'</p></div>';
  else h+='<div class="rep-wrap"><table class="rep-t"><thead><tr>'+R.cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+its.map(i=>'<tr class="k-'+i.type+'" data-act="open" data-id="'+esc(i.id)+'" tabindex="0">'+R.cols.map(c=>{
    const v=c[1](i)||'';
    if(c[0]==='Status')return '<td>'+(i.bk?'<span class="bk bk-'+i.bk+'">'+esc(v)+'</span>':'<span class="hint">—</span>')+'</td>';
    return '<td'+(/^(Accommodation|Restaurant|Journey)/.test(c[0])?' class="strong"':'')+'>'+esc(v)+'</td>';}).join('')+'</tr>').join('')+'</tbody></table></div>';
  h+=repUnmatchedHtml(repTab);
  $('#main').innerHTML=h+'</div>';
}

    case 'deltrip':{
      askChoice('Delete this trip?','All its items and notes will be removed from this app. Export first if unsure.',['Delete trip','Keep it']).then(c=>{
        if(c!==0)return;const t=trip();data.items.filter(i=>i.trip===t.id).forEach(i=>i.atts.forEach(removeAttFiles));
        data.items=data.items.filter(i=>i.trip!==t.id);data.trips=data.trips.filter(x=>x.id!==t.id);$('#dlg').close();changed();renderAll();});break;}
    case 'exporttrip':exportTrip();break;
    case 'savecid':{const v=$('#d_cid').value.trim();try{if(v)localStorage.setItem(LS_CID,v);else localStorage.removeItem(LS_CID);}catch(e){}toast('Saved. Reload the page, then sign in.');break;}
    case 'signin':signIn();break;
    case 'signout':signOut();break;
    case 'exportall':download('travel-backup-'+toISO(new Date())+'.json',JSON.stringify(data,null,1));break;
    case 'importall':$('#bk_file').click();break;
    case 'undoimport':{
      askChoice('Undo the last import?','Trips and items go back to how they were just before the last itinerary import.',['Undo import','Cancel']).then(c=>{
        if(c!==0)return;try{data=normalise(JSON.parse(localStorage.getItem(LS_PREV)));localStorage.removeItem(LS_PREV);}catch(e){toast('Nothing to undo.');return;}
        ensureSel();changed();renderAll();openData();toast('Import undone.');});break;}
  }
}
document.addEventListener('click',e=>{
  const img=e.target.closest('.att img');if(img&&img.dataset.full){$('#lbimg').src=img.dataset.full;$('#lb').showModal();return;}
  const el=e.target.closest('[data-act]');
  if(!el){const m=$('#addMenu');if(m&&!m.hidden&&!e.target.closest('.menuwrap'))m.hidden=true;return;}
  if(el.tagName==='A')return;
  onAct(el,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();onAct(e.target,e);}
});
$('#lbx').onclick=()=>$('#lb').close();
$('#lb').addEventListener('click',e=>{if(e.target.id==='lb')$('#lb').close();});
$('#tripSel').onchange=e=>{selTrip=e.target.value;selDate=null;try{localStorage.setItem(LS_SEL,selTrip);}catch(x){}renderAll();};
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(!b)return;view=b.dataset.view;try{localStorage.setItem(LS_VIEW,view);}catch(x){}renderAll();});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='i_mode')syncImpMode();
  if(t.id==='f_type'){changeType(t.value);return;}
  if(t.id==='rep_meal'){repMeal=t.value;renderAll();}
  if(t.id==='rep_mode'){repMode=t.value;renderAll();}
  if(t.id==='rep_all'){repAll=t.checked;renderAll();}
  if(t.id==='i_file'&&t.files[0]){
    const f=t.files[0];imp.file=f;
    if(/\.pdf$/i.test(f.name)||f.type==='application/pdf'){
      const ta=$('#i_text');ta.value='Reading the PDF…';
      pdfFileToText(f).then(txt=>{ta.value=txt;toast('PDF read. Check the text below, then press Preview.');})
        .catch(err=>{ta.value='';toast('Could not read that PDF: '+(err&&err.message||err));});
    }else{const rd=new FileReader();
    rd.onload=()=>{$('#i_text').value=String(rd.result);};rd.readAsText(f);}
  }
  if(t.id==='bk_file'&&t.files[0]){
    const rd=new FileReader();
    rd.onload=async()=>{
      try{const o=normalise(JSON.parse(String(rd.result)));if(!o.trips.length)throw new Error('No trips in that file');
        const c=await askChoice('Restore this backup?','This replaces the trips and items currently in the app ('+o.trips.length+' trip'+(o.trips.length>1?'s':'')+' in the file).',['Restore','Cancel']);
        if(c!==0)return;try{localStorage.setItem(LS_PREV,JSON.stringify(data));}catch(x){}
        data=o;ensureSel();changed();renderAll();openData();toast('Backup restored.');
      }catch(err){toast('That file is not a valid backup: '+err.message);}
    };rd.readAsText(t.files[0]);t.value='';
  }
  if(t.id==='dayTitle'||t.id==='dayNotes'){
    const tr=trip();if(!tr||!selDate)return;const dd=tr.days[selDate]||(tr.days[selDate]={title:'',notes:''});
    if(t.id==='dayTitle')dd.title=t.value.trim();else dd.notes=t.value;changed();renderRail();
  }
});
document.addEventListener('input',e=>{if(ed&&e.target.closest('#dlg'))updateGm();});
/* paste & drop of screenshots/files into the item dialog */
function zoneOf(t){const z=t&&t.closest&&t.closest('[data-zone]');return z?z.dataset.zone:'file';}
document.addEventListener('paste',e=>{
  if(!ed||!e.target.closest('#dlg'))return;
  const files=Array.from(e.clipboardData&&e.clipboardData.files||[]);
  if(!files.length)return;
  e.preventDefault();addFiles(files,zoneOf(e.target)==='map');
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('.drop');if(z&&ed){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('.drop');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('.drop');if(!z||!ed)return;
  e.preventDefault();z.classList.remove('over');addFiles(Array.from(e.dataTransfer.files),z.dataset.zone==='map');
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&msalAccount&&!ed)syncFromOneDrive();});

/* ============ START ============ */
window.__travel={srcById,attBlob,trip,geocode,pdfItemsToMarkdown,pdfFileToText,parseAny,parseItinerary,planImport,applyImport,getData:()=>data,setData:d=>{data=normalise(d);},openItem,toISO};   // exposed for automated tests
(async function init(){
  try{const c=localStorage.getItem(LS_KEY);if(c)data=normalise(JSON.parse(c));}catch(e){}
  try{dirty=localStorage.getItem(LS_DIRTY)==='1';}catch(e){}
  try{selTrip=localStorage.getItem(LS_SEL);view=localStorage.getItem(LS_VIEW)||'day';}catch(e){}
  if(!['day','cal','agenda','map'].includes(view))view='day';
  renderAll();setStatus('local');
  if(msalConfigured()&&window.msal){
    try{
      msalApp=new msal.PublicClientApplication({auth:{clientId:clientId(),authority:'https://login.microsoftonline.com/consumers',redirectUri:window.location.origin+window.location.pathname,navigateToLoginRequestUrl:false},cache:{cacheLocation:'localStorage'}});
      await msalApp.initialize();
      await msalApp.handleRedirectPromise().catch(()=>{});
      try{[localStorage,sessionStorage].forEach(st=>Object.keys(st).filter(k=>/interaction\.status$/.test(k)&&(k.includes(clientId())||!/[0-9a-f]{8}-[0-9a-f]{4}/.test(k))).forEach(k=>st.removeItem(k)));}catch(e){}
      const accts=msalApp.getAllAccounts();
      if(accts.length){msalAccount=accts[0];await syncFromOneDrive();}
    }catch(e){console.error(e);setStatus('local');}
  }
})();
})();
</script>
</body>
